# NetBeans Libraries Properties
# Generated for SmartShop project

libs.CopyLibs.classpath=\
    ${base}/CopyLibs/org-netbeans-modules-java-j2seproject-copylibstask.jar
libs.CopyLibs.displayName=CopyLibs Task
libs.CopyLibs.prop-version=3.0
# Gson JSON library
libs.gson.classpath=${base}/gson-2.10.1.jar

# Jakarta Activation (required by Jakarta Mail)
libs.jakarta.activation.classpath=${base}/jakarta.activation-2.1.2.jar

# Jakarta Mail
libs.jakarta.mail.classpath=${base}/jakarta.mail-2.0.1.jar

# Jakarta Servlet JSP JSTL
libs.jakarta.servlet.jsp.jstl.classpath=${base}/jakarta.servlet.jsp.jstl-3.0.1.jar
libs.jakarta.servlet.jsp.jstl-api.classpath=${base}/jakarta.servlet.jsp.jstl-api-3.0.1.jar

# SQL Server JDBC Driver
libs.mssql-jdbc.classpath=${base}/mssql-jdbc-12.10.0.jre11.jar

